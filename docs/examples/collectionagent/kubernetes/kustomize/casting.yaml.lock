apiVersion: v1alpha1
kind: CollectionAgent
metadata:
  name: signoz
spec:
  collector:
    kind: agent
    spec:
      cluster:
        replicas: 1
      config:
        data:
          collector/agent/agent.yaml: |
            extensions:
              health_check:
                endpoint: 0.0.0.0:13133
                path: /healthz

            receivers:
              otlp/grpc:
                protocols:
                  grpc:
                    endpoint: 0.0.0.0:4317
                    max_recv_msg_size_mib: 16
              otlp/http:
                protocols:
                  http:
                    endpoint: 0.0.0.0:4318

            processors:
              memory_limiter:
                check_interval: 5s
                limit_mib: 4000
                spike_limit_mib: 800
              resourcedetection:
                detectors:
                  - env
                  - system
                timeout: 5s
              batch:
                send_batch_size: 1000
                send_batch_max_size: 2048
                timeout: 10s

            exporters:
              otlphttp/signoz:
                endpoint: ${env:SIGNOZ_INGESTION_ENDPOINT}

            service:
              extensions: [health_check]
              pipelines:
                traces:
                  receivers: [otlp/http, otlp/grpc]
                  processors: [memory_limiter, resourcedetection, batch]
                  exporters: [otlphttp/signoz]
                metrics:
                  receivers: [otlp/http, otlp/grpc]
                  processors: [memory_limiter, resourcedetection, batch]
                  exporters: [otlphttp/signoz]
                logs:
                  receivers: [otlp/http, otlp/grpc]
                  processors: [memory_limiter, resourcedetection, batch]
                  exporters: [otlphttp/signoz]
      enabled: true
      env:
        OTEL_COLLECTOR_ROLE: agent
        SIGNOZ_INGESTION_ENDPOINT: http://<signoz-host>:4318
      image: otel/opentelemetry-collector-contrib:0.139.0
      version: 0.139.0
    status:
      config:
        data:
          collector/agent/agent.yaml: |
            extensions:
              health_check:
                endpoint: 0.0.0.0:13133
                path: /healthz

            receivers:
              otlp/grpc:
                protocols:
                  grpc:
                    endpoint: 0.0.0.0:4317
                    max_recv_msg_size_mib: 16
              otlp/http:
                protocols:
                  http:
                    endpoint: 0.0.0.0:4318

            processors:
              memory_limiter:
                check_interval: 5s
                limit_mib: 4000
                spike_limit_mib: 800
              resourcedetection:
                detectors:
                  - env
                  - system
                timeout: 5s
              batch:
                send_batch_size: 1000
                send_batch_max_size: 2048
                timeout: 10s

            exporters:
              otlphttp/signoz:
                endpoint: ${env:SIGNOZ_INGESTION_ENDPOINT}

            service:
              extensions: [health_check]
              pipelines:
                traces:
                  receivers: [otlp/http, otlp/grpc]
                  processors: [memory_limiter, resourcedetection, batch]
                  exporters: [otlphttp/signoz]
                metrics:
                  receivers: [otlp/http, otlp/grpc]
                  processors: [memory_limiter, resourcedetection, batch]
                  exporters: [otlphttp/signoz]
                logs:
                  receivers: [otlp/http, otlp/grpc]
                  processors: [memory_limiter, resourcedetection, batch]
                  exporters: [otlphttp/signoz]
      env:
        OTEL_COLLECTOR_ROLE: agent
        SIGNOZ_INGESTION_ENDPOINT: http://<signoz-host>:4318
  deployment:
    flavor: kustomize
    mode: kubernetes
