apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: collector-agent
    app.kubernetes.io/instance: signoz
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: signoz-collector-agent
  name: signoz-collector-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: collector-agent
      app.kubernetes.io/instance: signoz
      app.kubernetes.io/name: signoz-collector-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/component: collector-agent
        app.kubernetes.io/instance: signoz
        app.kubernetes.io/name: signoz-collector-agent
    spec:
      containers:
      - args:
        - --config=/conf/agent.yaml
        env:
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: K8S_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: K8S_HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: K8S_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: OTEL_COLLECTOR_ROLE
          value: agent
        - name: SIGNOZ_INGESTION_ENDPOINT
          value: http://<signoz-host>:4318
        image: otel/opentelemetry-collector-contrib:0.139.0
        livenessProbe:
          httpGet:
            path: /healthz
            port: 13133
        name: collector-agent
        ports:
        - containerPort: 4317
          hostPort: 4317
          name: otlp-grpc
          protocol: TCP
        - containerPort: 4318
          hostPort: 4318
          name: otlp-http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: 13133
        volumeMounts:
        - mountPath: /conf
          name: config
      serviceAccountName: signoz-collector-agent
      volumes:
      - configMap:
          name: signoz-collector-agent
        name: config
