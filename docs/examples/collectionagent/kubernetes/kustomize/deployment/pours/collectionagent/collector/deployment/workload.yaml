apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: collector-deployment
    app.kubernetes.io/instance: signoz
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: signoz-collector-deployment
  name: signoz-collector-deployment
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 120
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: collector-deployment
      app.kubernetes.io/instance: signoz
      app.kubernetes.io/name: signoz-collector-deployment
  template:
    metadata:
      labels:
        app.kubernetes.io/component: collector-deployment
        app.kubernetes.io/instance: signoz
        app.kubernetes.io/name: signoz-collector-deployment
    spec:
      containers:
      - args:
        - --config=/conf/deployment.yaml
        env:
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: K8S_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: K8S_HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: K8S_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: K8S_CLUSTER_NAME
          value: <cluster-name>
        - name: OTEL_COLLECTOR_ROLE
          value: deployment
        - name: SIGNOZ_INGESTION_ENDPOINT
          value: http://<signoz-host>:4318
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.cluster.name=$(K8S_CLUSTER_NAME)
        image: otel/opentelemetry-collector-contrib:0.139.0
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /healthz
            port: 13133
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: collector-deployment
        ports:
        - containerPort: 13133
          name: health-check
          protocol: TCP
        - containerPort: 4317
          name: otlp-grpc
          protocol: TCP
        - containerPort: 4318
          name: otlp-http
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /healthz
            port: 13133
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
        volumeMounts:
        - mountPath: /conf
          name: config
      serviceAccountName: signoz-collector-deployment
      volumes:
      - configMap:
          name: signoz-collector-deployment
        name: config
