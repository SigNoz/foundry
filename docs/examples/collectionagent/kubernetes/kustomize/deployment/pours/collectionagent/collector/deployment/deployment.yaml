exporters:
  otlphttp/signoz:
    endpoint: ${env:SIGNOZ_INGESTION_ENDPOINT}
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /healthz
processors:
  batch:
    send_batch_max_size: 2048
    send_batch_size: 1000
    timeout: 10s
  k8sattributes:
    extract:
      metadata:
      - k8s.namespace.name
      - k8s.deployment.name
      - k8s.statefulset.name
      - k8s.daemonset.name
      - k8s.cronjob.name
      - k8s.job.name
      - k8s.node.name
      - k8s.node.uid
      - k8s.pod.name
      - k8s.pod.uid
      - k8s.pod.start_time
    passthrough: false
    pod_association:
    - sources:
      - from: resource_attribute
        name: k8s.pod.ip
    - sources:
      - from: resource_attribute
        name: k8s.pod.uid
    - sources:
      - from: connection
  memory_limiter:
    check_interval: 5s
    limit_mib: 4000
    spike_limit_mib: 800
  resourcedetection:
    detectors:
    - env
    override: false
    timeout: 2s
receivers:
  k8s_cluster:
    allocatable_types_to_report:
    - cpu
    - memory
    collection_interval: 30s
    metrics:
      k8s.container.status.reason:
        enabled: true
      k8s.container.status.state:
        enabled: true
      k8s.node.condition:
        enabled: true
      k8s.pod.status_reason:
        enabled: true
    node_conditions_to_report:
    - Ready
    - MemoryPressure
    - DiskPressure
    - PIDPressure
    - NetworkUnavailable
    resource_attributes:
      container.runtime:
        enabled: true
      container.runtime.version:
        enabled: true
      k8s.container.status.last_terminated_reason:
        enabled: true
      k8s.kubelet.version:
        enabled: true
      k8s.pod.qos_class:
        enabled: true
  k8s_events:
    auth_type: serviceAccount
  otlp/grpc:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 16
  otlp/http:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
service:
  extensions:
  - health_check
  pipelines:
    logs:
      exporters:
      - otlphttp/signoz
      processors:
      - memory_limiter
      - resourcedetection
      - k8sattributes
      - batch
      receivers:
      - otlp/http
      - otlp/grpc
      - k8s_events
    metrics:
      exporters:
      - otlphttp/signoz
      processors:
      - memory_limiter
      - resourcedetection
      - k8sattributes
      - batch
      receivers:
      - otlp/http
      - otlp/grpc
      - k8s_cluster
    traces:
      exporters:
      - otlphttp/signoz
      processors:
      - memory_limiter
      - resourcedetection
      - k8sattributes
      - batch
      receivers:
      - otlp/http
      - otlp/grpc
