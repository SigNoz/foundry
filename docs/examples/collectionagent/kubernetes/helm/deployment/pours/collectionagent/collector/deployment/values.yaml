clusterName: <cluster-name>
fullnameOverride: signoz
otelAgent:
  enabled: false
  name: collector-agent
otelDeployment:
  additionalEnvs:
    OTEL_COLLECTOR_ROLE: deployment
    SIGNOZ_INGESTION_ENDPOINT: http://<signoz-host>:4318
  config:
    exporters:
      otlphttp/signoz:
        endpoint: ${env:SIGNOZ_INGESTION_ENDPOINT}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
        path: /healthz
      pprof: null
      zpages: null
    processors:
      batch:
        send_batch_max_size: 2048
        send_batch_size: 1000
        timeout: 10s
      k8sattributes:
        extract:
          metadata:
          - k8s.namespace.name
          - k8s.deployment.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.cronjob.name
          - k8s.job.name
          - k8s.node.name
          - k8s.node.uid
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.pod.start_time
        passthrough: false
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: connection
      memory_limiter:
        check_interval: 5s
        limit_mib: 4000
        spike_limit_mib: 800
      resource/identity:
        attributes:
        - action: insert
          key: k8s.cluster.name
          value: ${env:K8S_CLUSTER_NAME}
      resourcedetection:
        detectors:
        - env
        override: false
        timeout: 2s
    receivers:
      k8s_cluster:
        allocatable_types_to_report:
        - cpu
        - memory
        collection_interval: 30s
        metrics:
          k8s.container.status.reason:
            enabled: true
          k8s.container.status.state:
            enabled: true
          k8s.node.condition:
            enabled: true
          k8s.pod.status_reason:
            enabled: true
        node_conditions_to_report:
        - Ready
        - MemoryPressure
        - DiskPressure
        - PIDPressure
        - NetworkUnavailable
        resource_attributes:
          container.runtime:
            enabled: true
          container.runtime.version:
            enabled: true
          k8s.container.status.last_terminated_reason:
            enabled: true
          k8s.kubelet.version:
            enabled: true
          k8s.pod.qos_class:
            enabled: true
      k8s_events:
        auth_type: serviceAccount
      otlp/grpc:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 16
      otlp/http:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    service:
      extensions:
      - health_check
      pipelines:
        logs:
          exporters:
          - otlphttp/signoz
          processors:
          - memory_limiter
          - resourcedetection
          - resource/identity
          - k8sattributes
          - batch
          receivers:
          - otlp/http
          - otlp/grpc
          - k8s_events
        metrics:
          exporters:
          - otlphttp/signoz
          processors:
          - memory_limiter
          - resourcedetection
          - resource/identity
          - k8sattributes
          - batch
          receivers:
          - otlp/http
          - otlp/grpc
          - k8s_cluster
        traces:
          exporters:
          - otlphttp/signoz
          processors:
          - memory_limiter
          - resourcedetection
          - resource/identity
          - k8sattributes
          - batch
          receivers:
          - otlp/http
          - otlp/grpc
      telemetry:
        logs:
          encoding: json
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.139.0
  livenessProbe:
    path: /healthz
  name: collector-deployment
  ports:
    otlp:
      containerPort: 4317
      enabled: true
      protocol: TCP
      servicePort: 4317
    otlp-http:
      containerPort: 4318
      enabled: true
      protocol: TCP
      servicePort: 4318
  readinessProbe:
    path: /healthz
  replicaCount: 1
presets:
  clusterMetrics:
    enabled: false
  debugExporter:
    enabled: false
  hostMetrics:
    enabled: false
  k8sEvents:
    enabled: false
  kubeletMetrics:
    enabled: false
  kubernetesAttributes:
    enabled: false
  logsCollection:
    enabled: false
  otlpExporter:
    enabled: false
  otlphttpExporter:
    enabled: false
  prometheus:
    enabled: false
  resourceDetection:
    enabled: false
  selfTelemetry:
    logs:
      enabled: false
    metrics:
      enabled: false
    traces:
      enabled: false
