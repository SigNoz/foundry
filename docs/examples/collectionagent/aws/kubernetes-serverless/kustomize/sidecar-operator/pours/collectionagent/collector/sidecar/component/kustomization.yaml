apiVersion: kustomize.config.k8s.io/v1alpha1
configurations:
- kustomizeconfig.yaml
kind: Component
patches:
- path: patch-template.yaml
  target:
    kind: (Deployment|StatefulSet|Job|DaemonSet|ReplicaSet)
    labelSelector: foundry.signoz.io/kubernetes-collector-sidecar=enabled
- path: patch-cronjob.yaml
  target:
    kind: CronJob
    labelSelector: foundry.signoz.io/kubernetes-collector-sidecar=enabled
resources:
- role.yaml
- rolebinding.yaml
vars:
- fieldref:
    fieldPath: metadata.namespace
  name: signoz-collector-sidecar-namespace
  objref:
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    name: signoz-collector-sidecar
