apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  labels:
    app.kubernetes.io/component: collector-sidecar
    app.kubernetes.io/instance: signoz
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: signoz-collector-sidecar
  name: signoz-collector-sidecar
spec:
  config:
    exporters:
      otlphttp/signoz:
        endpoint: ${env:SIGNOZ_INGESTION_ENDPOINT}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
        path: /healthz
    processors:
      batch:
        send_batch_max_size: 2048
        send_batch_size: 1000
        timeout: 10s
      k8sattributes:
        extract:
          metadata:
          - k8s.namespace.name
          - k8s.deployment.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.cronjob.name
          - k8s.job.name
          - k8s.node.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.pod.start_time
        filter:
          namespace: ${env:K8S_NAMESPACE}
          node_from_env_var: K8S_NODE_NAME
        passthrough: false
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 20
      resource/identity:
        attributes:
        - action: insert
          key: k8s.pod.name
          value: ${env:K8S_POD_NAME}
        - action: insert
          key: k8s.pod.uid
          value: ${env:K8S_POD_UID}
        - action: insert
          key: k8s.namespace.name
          value: ${env:K8S_NAMESPACE}
        - action: insert
          key: k8s.node.name
          value: ${env:K8S_NODE_NAME}
        - action: insert
          key: cloud.provider
          value: aws
        - action: insert
          key: cloud.platform
          value: aws_eks
        - action: insert
          key: k8s.cluster.name
          value: ${env:K8S_CLUSTER_NAME}
      resourcedetection:
        detectors:
        - env
        timeout: 5s
    receivers:
      otlp/grpc:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 16
      otlp/http:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    service:
      extensions:
      - health_check
      pipelines:
        logs:
          exporters:
          - otlphttp/signoz
          processors:
          - memory_limiter
          - resourcedetection
          - resource/identity
          - k8sattributes
          - batch
          receivers:
          - otlp/http
          - otlp/grpc
        metrics:
          exporters:
          - otlphttp/signoz
          processors:
          - memory_limiter
          - resourcedetection
          - resource/identity
          - k8sattributes
          - batch
          receivers:
          - otlp/http
          - otlp/grpc
        traces:
          exporters:
          - otlphttp/signoz
          processors:
          - memory_limiter
          - resourcedetection
          - resource/identity
          - k8sattributes
          - batch
          receivers:
          - otlp/http
          - otlp/grpc
  env:
  - name: K8S_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  - name: K8S_POD_IP
    valueFrom:
      fieldRef:
        fieldPath: status.podIP
  - name: K8S_HOST_IP
    valueFrom:
      fieldRef:
        fieldPath: status.hostIP
  - name: K8S_POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: K8S_POD_UID
    valueFrom:
      fieldRef:
        fieldPath: metadata.uid
  - name: K8S_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  - name: K8S_CLUSTER_NAME
    value: <your-cluster>
  - name: OTEL_COLLECTOR_ROLE
    value: sidecar
  - name: SIGNOZ_INGESTION_ENDPOINT
    value: http://<signoz-host>:4318
  image: otel/opentelemetry-collector-contrib:0.139.0
  mode: sidecar
  ports:
  - name: health-check
    port: 13133
    protocol: TCP
  - name: otlp-grpc
    port: 4317
    protocol: TCP
  - name: otlp-http
    port: 4318
    protocol: TCP
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 200m
      memory: 256Mi
