apiVersion: v1alpha1
kind: CollectionAgent
metadata:
  name: signoz
spec:
  collector:
    kind: sidecar
    spec:
      cluster:
        replicas: 1
      config:
        data:
          collector/sidecar/sidecar.yaml: |
            exporters:
              otlphttp/signoz:
                endpoint: ${env:SIGNOZ_INGESTION_ENDPOINT}
            extensions:
              health_check:
                endpoint: 0.0.0.0:13133
                path: /healthz
            processors:
              batch:
                send_batch_max_size: 2048
                send_batch_size: 1000
                timeout: 10s
              k8sattributes:
                extract:
                  metadata:
                  - k8s.namespace.name
                  - k8s.deployment.name
                  - k8s.statefulset.name
                  - k8s.daemonset.name
                  - k8s.cronjob.name
                  - k8s.job.name
                  - k8s.node.name
                  - k8s.pod.name
                  - k8s.pod.uid
                  - k8s.pod.start_time
                filter:
                  namespace: ${env:K8S_NAMESPACE}
                  node_from_env_var: K8S_NODE_NAME
                passthrough: false
                pod_association:
                - sources:
                  - from: resource_attribute
                    name: k8s.pod.uid
              memory_limiter:
                check_interval: 5s
                limit_percentage: 80
                spike_limit_percentage: 20
              resource/identity:
                attributes:
                - action: insert
                  key: k8s.pod.name
                  value: ${env:K8S_POD_NAME}
                - action: insert
                  key: k8s.pod.uid
                  value: ${env:K8S_POD_UID}
                - action: insert
                  key: k8s.namespace.name
                  value: ${env:K8S_NAMESPACE}
                - action: insert
                  key: k8s.node.name
                  value: ${env:K8S_NODE_NAME}
                - action: insert
                  key: cloud.provider
                  value: aws
                - action: insert
                  key: cloud.platform
                  value: aws_eks
                - action: insert
                  key: k8s.cluster.name
                  value: ${env:K8S_CLUSTER_NAME}
              resourcedetection:
                detectors:
                - env
                timeout: 5s
            receivers:
              otlp/grpc:
                protocols:
                  grpc:
                    endpoint: 0.0.0.0:4317
                    max_recv_msg_size_mib: 16
              otlp/http:
                protocols:
                  http:
                    endpoint: 0.0.0.0:4318
            service:
              extensions:
              - health_check
              pipelines:
                logs:
                  exporters:
                  - otlphttp/signoz
                  processors:
                  - memory_limiter
                  - resourcedetection
                  - resource/identity
                  - k8sattributes
                  - batch
                  receivers:
                  - otlp/http
                  - otlp/grpc
                metrics:
                  exporters:
                  - otlphttp/signoz
                  processors:
                  - memory_limiter
                  - resourcedetection
                  - resource/identity
                  - k8sattributes
                  - batch
                  receivers:
                  - otlp/http
                  - otlp/grpc
                traces:
                  exporters:
                  - otlphttp/signoz
                  processors:
                  - memory_limiter
                  - resourcedetection
                  - resource/identity
                  - k8sattributes
                  - batch
                  receivers:
                  - otlp/http
                  - otlp/grpc
      enabled: true
      env:
        K8S_CLUSTER_NAME: <your-cluster>
        OTEL_COLLECTOR_ROLE: sidecar
        SIGNOZ_INGESTION_ENDPOINT: http://<signoz-host>:4318
      image: otel/opentelemetry-collector-contrib:0.139.0
      version: 0.139.0
    status:
      config:
        data:
          collector/sidecar/sidecar.yaml: |
            exporters:
              otlphttp/signoz:
                endpoint: ${env:SIGNOZ_INGESTION_ENDPOINT}
            extensions:
              health_check:
                endpoint: 0.0.0.0:13133
                path: /healthz
            processors:
              batch:
                send_batch_max_size: 2048
                send_batch_size: 1000
                timeout: 10s
              k8sattributes:
                extract:
                  metadata:
                  - k8s.namespace.name
                  - k8s.deployment.name
                  - k8s.statefulset.name
                  - k8s.daemonset.name
                  - k8s.cronjob.name
                  - k8s.job.name
                  - k8s.node.name
                  - k8s.pod.name
                  - k8s.pod.uid
                  - k8s.pod.start_time
                filter:
                  namespace: ${env:K8S_NAMESPACE}
                  node_from_env_var: K8S_NODE_NAME
                passthrough: false
                pod_association:
                - sources:
                  - from: resource_attribute
                    name: k8s.pod.uid
              memory_limiter:
                check_interval: 5s
                limit_percentage: 80
                spike_limit_percentage: 20
              resource/identity:
                attributes:
                - action: insert
                  key: k8s.pod.name
                  value: ${env:K8S_POD_NAME}
                - action: insert
                  key: k8s.pod.uid
                  value: ${env:K8S_POD_UID}
                - action: insert
                  key: k8s.namespace.name
                  value: ${env:K8S_NAMESPACE}
                - action: insert
                  key: k8s.node.name
                  value: ${env:K8S_NODE_NAME}
                - action: insert
                  key: cloud.provider
                  value: aws
                - action: insert
                  key: cloud.platform
                  value: aws_eks
                - action: insert
                  key: k8s.cluster.name
                  value: ${env:K8S_CLUSTER_NAME}
              resourcedetection:
                detectors:
                - env
                timeout: 5s
            receivers:
              otlp/grpc:
                protocols:
                  grpc:
                    endpoint: 0.0.0.0:4317
                    max_recv_msg_size_mib: 16
              otlp/http:
                protocols:
                  http:
                    endpoint: 0.0.0.0:4318
            service:
              extensions:
              - health_check
              pipelines:
                logs:
                  exporters:
                  - otlphttp/signoz
                  processors:
                  - memory_limiter
                  - resourcedetection
                  - resource/identity
                  - k8sattributes
                  - batch
                  receivers:
                  - otlp/http
                  - otlp/grpc
                metrics:
                  exporters:
                  - otlphttp/signoz
                  processors:
                  - memory_limiter
                  - resourcedetection
                  - resource/identity
                  - k8sattributes
                  - batch
                  receivers:
                  - otlp/http
                  - otlp/grpc
                traces:
                  exporters:
                  - otlphttp/signoz
                  processors:
                  - memory_limiter
                  - resourcedetection
                  - resource/identity
                  - k8sattributes
                  - batch
                  receivers:
                  - otlp/http
                  - otlp/grpc
      env:
        K8S_CLUSTER_NAME: <your-cluster>
        OTEL_COLLECTOR_ROLE: sidecar
        SIGNOZ_INGESTION_ENDPOINT: http://<signoz-host>:4318
  deployment:
    flavor: kustomize
    mode: kubernetes-serverless
    platform: aws
