kind: CronJob
metadata:
  name: signoz-collector-sidecar
spec:
  jobTemplate:
    spec:
      template:
        spec:
          initContainers:
          - args:
            - --config=/conf/sidecar.yaml
            env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: K8S_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_CLUSTER_NAME
              value: <your-cluster>
            - name: OTEL_COLLECTOR_ROLE
              value: sidecar
            - name: SIGNOZ_INGESTION_ENDPOINT
              value: http://<signoz-host>:4318
            image: otel/opentelemetry-collector-contrib:0.139.0
            livenessProbe:
              failureThreshold: 6
              httpGet:
                path: /healthz
                port: 13133
              initialDelaySeconds: 10
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 5
            name: signoz-collector-sidecar
            ports:
            - containerPort: 13133
              protocol: TCP
            - containerPort: 4317
              protocol: TCP
            - containerPort: 4318
              protocol: TCP
            readinessProbe:
              failureThreshold: 6
              httpGet:
                path: /healthz
                port: 13133
              initialDelaySeconds: 10
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 5
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 200m
                memory: 256Mi
            restartPolicy: Always
            volumeMounts:
            - mountPath: /conf
              name: signoz-collector-sidecar
          volumes:
          - configMap:
              name: signoz-collector-sidecar
            name: signoz-collector-sidecar
