apiVersion: kustomize.config.k8s.io/v1alpha1
configMapGenerator:
- files:
  - sidecar.yaml
  name: signoz-collector-sidecar
  options:
    labels:
      foundry.signoz.io/kind: CollectionAgent
      foundry.signoz.io/managed-by: foundry
      foundry.signoz.io/name: signoz
configurations:
- kustomizeconfig.yaml
kind: Component
patches:
- path: patch-template.yaml
  target:
    kind: (Deployment|StatefulSet|Job|DaemonSet|ReplicaSet)
    labelSelector: foundry.signoz.io/kubernetes-collector-sidecar=enabled
- path: patch-cronjob.yaml
  target:
    kind: CronJob
    labelSelector: foundry.signoz.io/kubernetes-collector-sidecar=enabled
resources:
- role.yaml
- rolebinding.yaml
vars:
- fieldref:
    fieldPath: metadata.namespace
  name: signoz-collector-sidecar-namespace
  objref:
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    name: signoz-collector-sidecar
