exporters:
  otlphttp/signoz:
    endpoint: ${env:SIGNOZ_INGESTION_ENDPOINT}
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /healthz
  k8s_observer:
    auth_type: serviceAccount
    observe_nodes: true
processors:
  batch:
    send_batch_max_size: 2048
    send_batch_size: 1000
    timeout: 10s
  k8sattributes:
    extract:
      metadata:
      - k8s.namespace.name
      - k8s.deployment.name
      - k8s.statefulset.name
      - k8s.daemonset.name
      - k8s.cronjob.name
      - k8s.job.name
      - k8s.node.name
      - k8s.node.uid
      - k8s.pod.name
      - k8s.pod.uid
      - k8s.pod.start_time
    passthrough: false
    pod_association:
    - sources:
      - from: resource_attribute
        name: k8s.pod.ip
    - sources:
      - from: resource_attribute
        name: k8s.pod.uid
    - sources:
      - from: connection
  memory_limiter:
    check_interval: 5s
    limit_mib: 4000
    spike_limit_mib: 800
  resource/identity:
    attributes:
    - action: insert
      key: cloud.provider
      value: aws
    - action: insert
      key: cloud.platform
      value: aws_eks
    - action: insert
      key: k8s.cluster.name
      value: ${env:K8S_CLUSTER_NAME}
  resourcedetection:
    detectors:
    - env
    override: false
    timeout: 2s
receivers:
  k8s_cluster:
    allocatable_types_to_report:
    - cpu
    - memory
    collection_interval: 30s
    metrics:
      k8s.container.status.reason:
        enabled: true
      k8s.container.status.state:
        enabled: true
      k8s.node.condition:
        enabled: true
      k8s.pod.status_reason:
        enabled: true
    node_conditions_to_report:
    - Ready
    - MemoryPressure
    - DiskPressure
    - PIDPressure
    - NetworkUnavailable
    resource_attributes:
      container.runtime:
        enabled: true
      container.runtime.version:
        enabled: true
      k8s.container.status.last_terminated_reason:
        enabled: true
      k8s.kubelet.version:
        enabled: true
      k8s.pod.qos_class:
        enabled: true
  k8s_events:
    auth_type: serviceAccount
  otlp/grpc:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 16
  otlp/http:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  receiver_creator:
    receivers:
      kubeletstats:
        config:
          auth_type: kubeConfig
          collection_interval: 30s
          endpoint: '`name`'
          extra_metadata_labels:
          - container.id
          - k8s.volume.type
          insecure_skip_verify: true
          k8s_api_config:
            auth_type: serviceAccount
          metric_groups:
          - container
          - pod
          - node
          - volume
          metrics:
            container.cpu.usage:
              enabled: true
            container.uptime:
              enabled: true
            k8s.container.cpu.node.utilization:
              enabled: true
            k8s.container.cpu_limit_utilization:
              enabled: true
            k8s.container.cpu_request_utilization:
              enabled: true
            k8s.container.memory.node.utilization:
              enabled: true
            k8s.container.memory_limit_utilization:
              enabled: true
            k8s.container.memory_request_utilization:
              enabled: true
            k8s.node.cpu.usage:
              enabled: true
            k8s.node.uptime:
              enabled: true
            k8s.pod.cpu.usage:
              enabled: true
            k8s.pod.cpu_limit_utilization:
              enabled: true
            k8s.pod.cpu_request_utilization:
              enabled: true
            k8s.pod.memory_limit_utilization:
              enabled: true
            k8s.pod.memory_request_utilization:
              enabled: true
            k8s.pod.uptime:
              enabled: true
          node: '`name`'
        rule: type == "k8s.node" && labels["eks.amazonaws.com/compute-type"] == "fargate"
    watch_observers:
    - k8s_observer
service:
  extensions:
  - health_check
  - k8s_observer
  pipelines:
    logs:
      exporters:
      - otlphttp/signoz
      processors:
      - memory_limiter
      - resourcedetection
      - resource/identity
      - k8sattributes
      - batch
      receivers:
      - otlp/http
      - otlp/grpc
      - k8s_events
    metrics:
      exporters:
      - otlphttp/signoz
      processors:
      - memory_limiter
      - resourcedetection
      - resource/identity
      - k8sattributes
      - batch
      receivers:
      - otlp/http
      - otlp/grpc
      - k8s_cluster
      - receiver_creator
    traces:
      exporters:
      - otlphttp/signoz
      processors:
      - memory_limiter
      - resourcedetection
      - resource/identity
      - k8sattributes
      - batch
      receivers:
      - otlp/http
      - otlp/grpc
  telemetry:
    logs:
      encoding: json
