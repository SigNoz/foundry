exporters:
  otlphttp/signoz:
    endpoint: ${env:SIGNOZ_INGESTION_ENDPOINT}
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /healthz
processors:
  batch:
    send_batch_max_size: 2048
    send_batch_size: 1000
    timeout: 10s
  memory_limiter:
    check_interval: 5s
    limit_mib: 4000
    spike_limit_mib: 800
  resourcedetection:
    detectors:
    - env
    - system
    timeout: 5s
receivers:
  hostmetrics:
    collection_interval: 60s
    scrapers:
      cpu: {}
      disk: {}
      filesystem: {}
      load: {}
      memory: {}
      network: {}
      nfs: {}
      paging: {}
      process:
        mute_process_exe_error: true
        mute_process_io_error: true
        mute_process_name_error: true
      processes: {}
      system: {}
  otlp/grpc:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 16
  otlp/http:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
service:
  extensions:
  - health_check
  pipelines:
    logs:
      exporters:
      - otlphttp/signoz
      processors:
      - memory_limiter
      - resourcedetection
      - batch
      receivers:
      - otlp/http
      - otlp/grpc
    metrics:
      exporters:
      - otlphttp/signoz
      processors:
      - memory_limiter
      - resourcedetection
      - batch
      receivers:
      - otlp/http
      - otlp/grpc
      - hostmetrics
    traces:
      exporters:
      - otlphttp/signoz
      processors:
      - memory_limiter
      - resourcedetection
      - batch
      receivers:
      - otlp/http
      - otlp/grpc
