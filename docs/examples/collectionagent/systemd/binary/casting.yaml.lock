              pipelines:
                logs:
                  exporters:
                  - otlphttp/signoz
                  processors:
                  - memory_limiter
                  - resourcedetection
                  - batch
                  receivers:
                  - otlp/http
                  - otlp/grpc
                  - journald
                metrics:
                  exporters:
                  - otlphttp/signoz
                  processors:
                  - memory_limiter
                  - resourcedetection
                  - batch
                  receivers:
                  - otlp/http
                  - otlp/grpc
                  - hostmetrics
                traces:
                  exporters:
                  - otlphttp/signoz
                  processors:
                  - memory_limiter
                  - resourcedetection
                  - batch
                  receivers:
                  - otlp/http
                  - otlp/grpc
      env:
        OTEL_COLLECTOR_ROLE: agent
        SIGNOZ_INGESTION_ENDPOINT: http://<signoz-host>:4318
  deployment:
    flavor: binary
    mode: systemd
