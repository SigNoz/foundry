apiVersion: v1alpha1
kind: CollectionAgent
metadata:
  annotations:
    foundry.signoz.io/collector-binary-path: /opt/signoz-collector-agent/bin/otelcol-contrib
  name: signoz
spec:
  collector:
    kind: agent
    spec:
      cluster:
        replicas: 1
      config:
        data:
          collector/agent/agent.yaml: |
            exporters:
              otlphttp/signoz:
                endpoint: ${env:SIGNOZ_INGESTION_ENDPOINT}
            extensions:
              health_check:
                endpoint: 0.0.0.0:13133
                path: /healthz
            processors:
              batch:
                send_batch_max_size: 2048
                send_batch_size: 1000
                timeout: 10s
              memory_limiter:
                check_interval: 5s
                limit_mib: 4000
                spike_limit_mib: 800
              resourcedetection:
                detectors:
                - env
                - ec2
                - gcp
                - azure
                - system
                override: false
                system:
                  hostname_sources:
                  - os
                  resource_attributes:
                    host.id:
                      enabled: true
                timeout: 2s
            receivers:
              hostmetrics:
                collection_interval: 60s
                scrapers:
                  cpu: {}
                  disk:
                    exclude:
                      devices:
                      - ^ram\d+$
                      - ^zram\d+$
                      - ^loop\d+$
                      - ^fd\d+$
                      - ^hd[a-z]\d+$
                      - ^sd[a-z]\d+$
                      - ^vd[a-z]\d+$
                      - ^xvd[a-z]\d+$
                      - ^nvme\d+n\d+p\d+$
                      match_type: regexp
                  filesystem:
                    exclude_fs_types:
                      fs_types:
                      - autofs
                      - binfmt_misc
                      - bpf
                      - cgroup2
                      - configfs
                      - debugfs
                      - devpts
                      - devtmpfs
                      - fusectl
                      - hugetlbfs
                      - iso9660
                      - mqueue
                      - nsfs
                      - overlay
                      - proc
                      - procfs
                      - pstore
                      - rpc_pipefs
                      - securityfs
                      - selinuxfs
                      - squashfs
                      - sysfs
                      - tracefs
                      match_type: strict
                    exclude_mount_points:
                      match_type: regexp
                      mount_points:
                      - /dev/*
                      - /proc/*
                      - /sys/*
                      - /run/credentials/*
                      - /run/k3s/containerd/*
                      - /var/lib/docker/*
                      - /var/lib/containers/storage/*
                      - /var/lib/kubelet/*
                      - /snap/*
                  load: {}
                  memory: {}
                  network:
                    exclude:
                      interfaces:
                      - ^veth.*$
                      - ^docker.*$
                      - ^br-.*$
                      - ^flannel.*$
                      - ^cali.*$
                      - ^cbr.*$
                      - ^cni.*$
                      - ^dummy.*$
                      - ^tailscale.*$
                      - ^lo$
                      match_type: regexp
                  paging: {}
                  process:
                    mute_process_exe_error: true
                    mute_process_io_error: true
                    mute_process_name_error: true
                    mute_process_user_error: true
                  processes: {}
                  system: {}
              journald:
                operators:
                - expr: body["_SYSTEMD_UNIT"] != nil and body["_SYSTEMD_UNIT"] matches "-collector-agent\\.service$"
                  type: filter
                - from: body._SYSTEMD_UNIT
                  if: body["_SYSTEMD_UNIT"] != nil and body["_SYSTEMD_UNIT"] != ""
                  to: resource["service.name"]
                  type: copy
                - from: body.SYSLOG_IDENTIFIER
                  if: resource["service.name"] == nil and body["SYSLOG_IDENTIFIER"] != nil
                  to: resource["service.name"]
                  type: copy
                - field: resource["service.name"]
                  regex: \.service$
                  replace_with: ""
                  type: regex_replace
                priority: warning
                start_at: end
              otlp/grpc:
                protocols:
                  grpc:
                    endpoint: 0.0.0.0:4317
                    max_recv_msg_size_mib: 16
              otlp/http:
                protocols:
                  http:
                    endpoint: 0.0.0.0:4318
            service:
              extensions:
              - health_check
              pipelines:
                logs:
                  exporters:
                  - otlphttp/signoz
                  processors:
                  - memory_limiter
                  - resourcedetection
                  - batch
                  receivers:
                  - otlp/http
                  - otlp/grpc
                  - journald
                metrics:
                  exporters:
                  - otlphttp/signoz
                  processors:
                  - memory_limiter
                  - resourcedetection
                  - batch
                  receivers:
                  - otlp/http
                  - otlp/grpc
                  - hostmetrics
                traces:
                  exporters:
                  - otlphttp/signoz
                  processors:
                  - memory_limiter
                  - resourcedetection
                  - batch
                  receivers:
                  - otlp/http
                  - otlp/grpc
      enabled: true
      env:
        OTEL_COLLECTOR_ROLE: agent
        SIGNOZ_INGESTION_ENDPOINT: http://<signoz-host>:4318
      image: otel/opentelemetry-collector-contrib:0.139.0
      version: 0.139.0
    status:
      config:
        data:
          collector/agent/agent.yaml: |
