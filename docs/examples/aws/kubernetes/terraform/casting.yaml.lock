apiVersion: v1alpha1
kind: Infrastructure
metadata:
  name: signoz
spec:
  deployment:
    flavor: terraform
    mode: kubernetes
    platform: aws
  resource:
    kind: Installation
    status:
      addresses:
        apiserver:
        - tcp://0.0.0.0:8080
        otlp:
        - tcp://0.0.0.0:4317
        - tcp://0.0.0.0:4318
      config:
        data:
          resource.yaml: |
            nodeGroups:
            - count: 3
              disk: 50
              memory: 8
              name: persistent
              persistent: true
              vcpus: 2
            - count: 1
              disk: 20
              memory: 4
              name: ephemeral
              persistent: false
              vcpus: 2
