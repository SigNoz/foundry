properties:
  configuration:
    activeRevisionsMode: Single
    ingress:
      additionalPortMappings:
      - external: false
        targetPort: 9234
      external: false
      targetPort: 9181
      transport: tcp
    secrets:
    - name: keeper-config
      value: |
        listen_host: 0.0.0.0
        logger:
          level: information
          console: true
        keeper_server:
          four_letter_word_white_list: "*"
          coordination_settings:
            operation_timeout_ms: 10000
            raft_logs_level: warning
            session_timeout_ms: 30000
          log_storage_path: /var/lib/clickhouse/coordination/log
          raft_configuration:
            server:
            - hostname: signoz-clickhouse-keeper-0
              port: 9234
              id: 0
          server_id: 0
          snapshot_storage_path: /var/lib/clickhouse/coordination/snapshots
          tcp_port: 9181
  template:
    containers:
    - command:
      - /usr/bin/clickhouse-keeper
      - --config-file=/etc/clickhouse-keeper/keeper.yaml
      image: clickhouse/clickhouse-keeper:25.5.6
      name: clickhouse-keeper
      probes:
      - initialDelaySeconds: 30
        periodSeconds: 10
        tcpSocket:
          port: 9181
        type: Liveness
      - initialDelaySeconds: 10
        periodSeconds: 5
        tcpSocket:
          port: 9181
        type: Readiness
      resources:
        cpu: 0.5
        memory: 1Gi
      volumeMounts:
      - mountPath: /var/lib/clickhouse-keeper
        volumeName: keeper-data
      - mountPath: /etc/clickhouse-keeper
        volumeName: keeper-config
    scale:
      maxReplicas: 1
      minReplicas: 1
    volumes:
    - name: keeper-data
      storageType: EmptyDir
    - name: keeper-config
      secrets:
      - path: keeper.yaml
        secretRef: keeper-config
      storageType: Secret
type: Microsoft.App/containerApps
