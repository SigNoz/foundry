properties:
  configuration:
    activeRevisionsMode: Single
    ingress:
      additionalPortMappings:
      - external: true
        targetPort: 4318
      external: true
      targetPort: 4317
      transport: tcp
    secrets:
    - name: ingester-yaml
      value: |
        connectors:
          signozmeter:
            metrics_flush_interval: 1h
            dimensions:
              - name: service.name
              - name: deployment.environment
              - name: host.name
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: "0.0.0.0:4317"
              http:
                endpoint: "0.0.0.0:4318"
        processors:
          batch:
            send_batch_size: 20000
            send_batch_max_size: 25000
            timeout: 1s
          batch/meter:
            send_batch_size: 20000
            send_batch_max_size: 25000
            timeout: 1s
          signozspanmetrics/delta:
            metrics_exporter: signozclickhousemetrics
            metrics_flush_interval: 60s
            latency_histogram_buckets:
              - 100us
              - 1ms
              - 2ms
              - 6ms
              - 10ms
              - 50ms
              - 100ms
              - 250ms
              - 500ms
              - 1000ms
              - 1400ms
              - 2000ms
              - 5s
              - 10s
              - 20s
              - 40s
              - 60s
            dimensions_cache_size: 100000
            aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
            enable_exp_histogram: true
            dimensions:
              - name: service.namespace
                default: default
              - name: deployment.environment
                default: default
              - name: signoz.collector.id
              - name: service.version
        exporters:
          clickhousetraces:
            datasource: tcp://signoz-clickhouse:9000/signoz_traces
            low_cardinal_exception_grouping: ${env:LOW_CARDINAL_EXCEPTION_GROUPING}
            use_new_schema: true
            timeout: 45s
            sending_queue:
              enabled: false
          signozclickhousemetrics:
            dsn: tcp://signoz-clickhouse:9000/signoz_metrics
            timeout: 45s
            sending_queue:
              enabled: false
          clickhouselogsexporter:
            dsn: tcp://signoz-clickhouse:9000/signoz_logs
            use_new_schema: true
            timeout: 45s
            sending_queue:
              enabled: false
          signozclickhousemeter:
            dsn: tcp://signoz-clickhouse:9000/signoz_meter
            timeout: 45s
            sending_queue:
              enabled: false
        extensions:
          signoz_health_check:
            endpoint: "0.0.0.0:13133"
          pprof:
            endpoint: "0.0.0.0:1777"
        service:
          telemetry:
            logs:
              encoding: json
          extensions:
            - signoz_health_check
            - pprof
          pipelines:
            traces:
              receivers:
                - otlp
              processors:
                - signozspanmetrics/delta
                - batch
              exporters:
                - clickhousetraces
                - signozmeter
            metrics:
              receivers:
                - otlp
              processors:
                - batch
              exporters:
                - signozclickhousemetrics
                - signozmeter
            logs:
              receivers:
                - otlp
              processors:
                - batch
              exporters:
                - clickhouselogsexporter
                - signozmeter
            metrics/meter:
              receivers:
                - signozmeter
              processors:
                - batch/meter
              exporters:
                - signozclickhousemeter
    - name: opamp-yaml
      value: |
        server_endpoint: ws://signoz-signoz:4320/v1/opamp
  template:
    containers:
    - args:
      - --config=/conf/ingester.yaml
      - --manager-config=/conf/opamp.yaml
      - --copy-path=/var/tmp/collector-config.yaml
      command:
      - /signoz-otel-collector
      image: signoz/signoz-otel-collector:latest
      name: collector
      probes:
      - httpGet:
          path: /
          port: 13133
        initialDelaySeconds: 5
        periodSeconds: 10
        type: Liveness
      - httpGet:
          path: /
          port: 13133
        initialDelaySeconds: 5
        periodSeconds: 10
        type: Readiness
      resources:
        cpu: 1
        memory: 2Gi
      volumeMounts:
      - mountPath: /conf/
        volumeName: collector-config
    initContainers:
    - args:
      - migrate
      - sync
      - check
      command:
      - /signoz-otel-collector
      env:
      - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
        value: tcp://signoz-clickhouse:9000
      image: signoz/signoz-otel-collector:latest
      name: check
      resources:
        cpu: 0.25
        memory: 0.5Gi
    scale:
      maxReplicas: 1
      minReplicas: 1
    volumes:
    - name: collector-config
      secrets:
      - path: ingester.yaml
        secretRef: ingester-yaml
      - path: opamp.yaml
        secretRef: opamp-yaml
      storageType: Secret
type: Microsoft.App/containerApps
