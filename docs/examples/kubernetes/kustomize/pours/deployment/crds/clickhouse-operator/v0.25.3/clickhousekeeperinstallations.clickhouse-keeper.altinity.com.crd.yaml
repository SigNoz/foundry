                          reconcile each StatefulSet.spec resource described in `chi.spec.configuration.clusters`
                        type: string
                      replicaServiceTemplate:
                        description: optional, template name from chi.spec.templates.serviceTemplates,
                          allows customization for each `Service` resource which will
                          created by `clickhouse-operator` which cover each replica
                          inside each shard inside each clickhouse cluster described
                          in `chi.spec.configuration.clusters`
                        type: string
                      serviceTemplate:
                        description: optional, template name from chi.spec.templates.serviceTemplates.
                          used for customization of the `Service` resource, created
                          by `clickhouse-operator` to cover all clusters in whole
                          `chi` resource
                        type: string
                      serviceTemplates:
                        description: optional, template names from chi.spec.templates.serviceTemplates.
                          used for customization of the `Service` resources, created
                          by `clickhouse-operator` to cover all clusters in whole
                          `chi` resource
                        items:
                          type: string
                        nullable: true
                        type: array
                      shardServiceTemplate:
                        description: optional, template name from chi.spec.templates.serviceTemplates,
                          allows customization for each `Service` resource which will
                          created by `clickhouse-operator` which cover each shard
                          inside clickhouse cluster described in `chi.spec.configuration.clusters`
                        type: string
                      volumeClaimTemplate:
                        description: optional, alias for dataVolumeClaimTemplate,
                          template name from chi.spec.templates.volumeClaimTemplates,
                          allows customization each `PVC` which will mount for clickhouse
                          data directory in each `Pod` during render and reconcile
                          every StatefulSet.spec resource described in `chi.spec.configuration.clusters`
                        type: string
                    type: object
                type: object
              namespaceDomainPattern:
                description: |
                  Custom domain pattern which will be used for DNS names of `Service` or `Pod`.
                  Typical use scenario - custom cluster domain in Kubernetes cluster
                  Example: %s.svc.my.test
                type: string
              reconciling:
                description: Optional, allows tuning reconciling cycle for ClickhouseInstallation
                  from clickhouse-operator side
                properties:
                  cleanup:
                    description: Optional, defines behavior for cleanup Kubernetes
                      resources during reconcile cycle
                    properties:
                      reconcileFailedObjects:
                        description: |
                          Describes what clickhouse-operator should do with Kubernetes resources which are failed during reconcile.
                          Default behavior is `Retain`"
                        properties:
                          configMap:
                            description: Behavior policy for failed ConfigMap, `Retain`
                              by default
                            enum:
                            - ""
                            - Retain
                            - Delete
