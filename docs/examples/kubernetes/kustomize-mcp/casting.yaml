# Kustomize deployment with the SigNoz MCP server enabled.
#
# After `foundryctl cast`, mint a SigNoz API key (Settings -> API Keys in the
# SigNoz UI) and point an MCP client at the mcp service; the in-cluster
# endpoint is http://signoz-mcp.signoz:8000/mcp. See docs/concepts/mcp-server.md
# for the full walkthrough.
apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: kustomize
    mode: kubernetes
  mcp:
    spec:
      enabled: true
