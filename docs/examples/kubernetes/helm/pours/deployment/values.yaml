clickhouse:
  enabled: true
  image:
    repository: clickhouse/clickhouse-server
    tag: 25.5.6
  keeper:
    enabled: true
    image:
      repository: clickhouse/clickhouse-keeper
      tag: 25.5.6
    replicaCount: 1
  layout:
    replicasCount: 0
    shardsCount: 1
otelCollector:
  enabled: true
  image:
    repository: signoz/signoz-otel-collector
    tag: latest
  replicaCount: 1
postgresql:
  auth:
    database: signoz
    password: signoz
    username: signoz
  enabled: true
  image:
    repository: postgres
    tag: 16
signoz:
  env:
    SIGNOZ_SQLSTORE_POSTGRES_DSN: postgres://signoz:signoz@signoz-metastore:5432/signoz?sslmode=disable
    SIGNOZ_SQLSTORE_PROVIDER: postgres
    SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
    SIGNOZ_TELEMETRYSTORE_PROVIDER: clickhouse
  image:
    repository: signoz/signoz
    tag: latest
  replicaCount: 1
