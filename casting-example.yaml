schemaVersion: v1
platform: linux
components:
  signoz:
    enabled: true
    replicas: 3 # HA configuration
    version: "0.39.2"
    env:
      - key: CLICKHOUSE_HOST
        value: localhost:9000
    config:
      alertmanager:
        provider: signoz
  clickhouse:
    enabled: true
    replicas: 3 # HA configuration
    version: "24.8"
    config:
      serverConfig:
        clickhouse:
          logger: 
            level: "trace"
  zookeeper:
    enabled: true
    replicas: 1 # Single instance
    version: "3.7"
    config:
      tickTime: 2182
  signozOtelCollector:
    enabled: true 
    replicas: 2 # HA configuration
    version: "0.39.2"
    env:
      - key: CLICKHOUSE_HOST
        value: localhost:9000
    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
        azure:
          endpoint: "0.0.0.0:4317"